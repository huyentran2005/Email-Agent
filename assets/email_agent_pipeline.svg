<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline các node của trợ lý email</title>
  <desc id="desc">Luồng từ Analyze qua Policy, Tools, Observe, Answer và Audit; Observe có thể quay lại Policy để mở rộng hoặc lập kế hoạch lại.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .node { stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .terminal { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <circle cx="48" cy="170" r="27" fill="#334155"/>
  <text x="48" y="170" class="terminal">START</text>

  <rect class="node" x="100" y="115" width="150" height="110" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="175" y="158" class="label">Analyze</text>
  <text x="175" y="184" class="detail">Hiểu intent</text>
  <text x="175" y="204" class="detail">Lập tool calls</text>

  <rect class="node" x="300" y="115" width="150" height="110" rx="18" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="375" y="158" class="label">Policy</text>
  <text x="375" y="184" class="detail">Chỉ cho phép</text>
  <text x="375" y="204" class="detail">read-only tools</text>

  <rect class="node" x="500" y="115" width="150" height="110" rx="18" fill="#dcfce7" stroke="#22c55e"/>
  <text x="575" y="158" class="label">Tools</text>
  <text x="575" y="184" class="detail">Email · Memory</text>
  <text x="575" y="204" class="detail">Deadline · Thread</text>

  <rect class="node" x="700" y="115" width="150" height="110" rx="18" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="775" y="158" class="label">Observe</text>
  <text x="775" y="184" class="detail">Kiểm tra kết quả</text>
  <text x="775" y="204" class="detail">Expand / replan</text>

  <rect class="node" x="900" y="115" width="150" height="110" rx="18" fill="#ffe4e6" stroke="#f43f5e"/>
  <text x="975" y="158" class="label">Answer</text>
  <text x="975" y="184" class="detail">Tổng hợp</text>
  <text x="975" y="204" class="detail">Nguồn · File · Link</text>

  <rect class="node" x="900" y="305" width="150" height="100" rx="18" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="975" y="345" class="label">Audit</text>
  <text x="975" y="371" class="detail">Trace và thống kê</text>

  <circle cx="1128" cy="355" r="27" fill="#334155"/>
  <text x="1128" y="355" class="terminal">END</text>

  <path class="edge" d="M75 170 H100"/>
  <path class="edge" d="M250 170 H300"/>
  <path class="edge" d="M450 170 H500"/>
  <text x="475" y="153" class="edge-label">allow</text>
  <path class="edge" d="M650 170 H700"/>
  <path class="edge" d="M850 170 H900"/>
  <text x="875" y="153" class="edge-label">đủ dữ liệu</text>
  <path class="edge" d="M975 225 V305"/>
  <path class="edge" d="M1050 355 H1101"/>

  <path class="edge" d="M375 225 V270 H900 V225"/>
  <text x="630" y="292" class="edge-label">deny / không có tool</text>

  <path class="edge" d="M775 225 V430 H375 V225"/>
  <text x="575" y="454" class="edge-label">expand hoặc replan → kiểm tra policy lại</text>
</svg>
